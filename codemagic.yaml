# Codemagic CI для AeroCloud.
#
# ВАЖНО: этот файл должен лежать в КОРНЕ git-репозитория,
# на той же ветке, которую выбрал Codemagic (обычно main).
#
# Скрипты ниже сами находят project.yml:
#   - в корне репозитория;
#   - или в подпапке AeroCloud/.
# Поэтому конфиг работает и если репозиторий — это папка AeroCloud,
# и если в репозиторий загружена родительская папка целиком.

workflows:
  ios-simulator:
    name: AeroCloud / iOS 27 Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # Если Codemagic ещё не показывает 27.1, замени на доступную 27.x
      # или latest и проверь наличие iOS 27 SDK.
      xcode: 27.1
      vars:
        XCODE_SCHEME: "AeroCloud"
        BUNDLE_ID: "app.aerocloud.ios"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Build and run in simulator
        script: |
          set -euo pipefail

          REPO_ROOT="$(pwd)"

          if [ -f project.yml ]; then
            PROJECT_DIR="."
          elif [ -f AeroCloud/project.yml ]; then
            PROJECT_DIR="AeroCloud"
          else
            echo "project.yml not found in repo root or AeroCloud/"
            exit 1
          fi

          cd "$PROJECT_DIR"
          echo "Building from: $PROJECT_DIR"

          brew install xcodegen
          xcodegen generate

          xcodebuild \
            -project AeroCloud.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p "$REPO_ROOT/artifacts"

          DEVICE_ID="$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-Fa-f-]{36}' | head -1 || true)"
          if [ -n "$DEVICE_ID" ]; then
            xcrun simctl boot "$DEVICE_ID" || true
            xcrun simctl bootstatus "$DEVICE_ID" -b || true
            xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/AeroCloud.app || true
            xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID" -designGallery || true
            sleep 5
            xcrun simctl io "$DEVICE_ID" screenshot gallery.png || true
            if [ -f gallery.png ]; then
              cp gallery.png "$REPO_ROOT/artifacts/gallery.png"
            fi
          else
            echo "No available iPhone simulator found; screenshot skipped"
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug-iphonesimulator/AeroCloud.app \
            "$REPO_ROOT/artifacts/AeroCloud-simulator.zip"

    artifacts:
      - artifacts/**

  quality:
    name: AeroCloud / Static checks + Core tests
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: 27.1

    scripts:
      - name: Validate
        script: |
          set -euo pipefail

          if [ -f project.yml ]; then
            PROJECT_DIR="."
          elif [ -f AeroCloud/project.yml ]; then
            PROJECT_DIR="AeroCloud"
          else
            echo "project.yml not found in repo root or AeroCloud/"
            exit 1
          fi

          cd "$PROJECT_DIR"
          brew install xcodegen swiftformat

          python3 scripts/validate.py
          python3 scripts/check_strings.py
          swiftformat --lint --config .swiftformat AeroCloud Packages
          swift test --package-path Packages/AeroCloudCore
